# Manifesto de KB — índice único de roteamento.
# Um agente lê ESTE arquivo (ou o index.md do domínio, ~20 linhas de navegação) antes de
# decidir qual concept/pattern abrir — nunca carrega um domínio inteiro de uma vez.
# mcp_validated/confidence vêm do frontmatter de cada index.md — null quando o domínio
# ainda não passou por validação via Context-7 MCP (não inventar data/score aqui).
version: "1.0"
last_updated: "2026-07-26"

limits:
  quick_reference: 100 # linhas, teto por quick-reference.md
  concept: 150          # linhas, teto por concepts/*.md
  pattern: 200          # linhas, teto por patterns/*.md

